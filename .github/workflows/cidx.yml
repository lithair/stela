# Generated by cidx generate github
# Source of truth: cidx.toml
#
# Regenerate with: cidx generate github -o .github/workflows/cidx.yml

name: CIDX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bootstrap:
    name: Bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      # HAND-PATCHED — `cidx generate github` emits
      #   go install github.com/cidx-org/cidx/cmd/cidx@latest
      # which silently installs v1.8.0: cidx's go.mod declares
      # `module github.com/cidx-org/cidx` with no /v2 suffix, so Go cannot see
      # any v2.x tag (`go list -m -versions` stops at v1.8.0) and pinning
      # @v2.1.1 is refused outright. v1.8.0 has no probatum preset and a
      # rustfmt preset missing `rustup component add`, which is exactly how
      # this workflow failed. Build from source until that is fixed upstream.
      # Re-apply this block after every `cidx generate github`.
      - name: Install CIDX
        run: |
          mkdir -p bin
          git clone --depth 1 --branch v2.1.1 https://github.com/cidx-org/cidx /tmp/cidx
          cd /tmp/cidx && go build -o "$GITHUB_WORKSPACE/bin/cidx" ./cmd/cidx
      - uses: actions/upload-artifact@v7
        with:
          name: cidx-binary
          path: bin/cidx
          retention-days: 1

  security:
    name: Security
    runs-on: ubuntu-latest
    needs: [bootstrap]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: cidx-binary
          path: bin
      - run: chmod +x bin/cidx
      - name: Run security
        run: ./bin/cidx run security

  code:
    name: Code
    runs-on: ubuntu-latest
    needs: [bootstrap]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: cidx-binary
          path: bin
      - run: chmod +x bin/cidx
      - name: Run code
        run: ./bin/cidx run code

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [bootstrap]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: cidx-binary
          path: bin
      - run: chmod +x bin/cidx
      - name: Run test
        run: ./bin/cidx run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [bootstrap]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: cidx-binary
          path: bin
      - run: chmod +x bin/cidx
      - name: Run build
        run: ./bin/cidx run build

