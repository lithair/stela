[package]
name = "stela"
version = "0.0.1"
edition = "2021"
authors = ["Lithair Team"]
license = "MIT OR Apache-2.0"
description = "Single-binary blog engine powered by Lithair — your words, set in stone. In development."
repository = "https://github.com/lithair/stela"
homepage = "https://stela.run"
keywords = ["blog", "cms", "lithair", "single-binary"]
categories = ["web-programming"]

[dependencies]
lithair-core = "1.7"
lithair-macros = "1.7"
# Tera 1.x on purpose: it is the version Zola uses, and "porting a Zola theme
# is reasonable work" is a stated pitch. Builtins stay on — rss.xml needs
# escape_xml, which is not auto-applied to non-.html templates.
tera = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
http = "1"
http-body-util = "0.1"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
getrandom = "0.3"
