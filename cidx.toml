# CIDX Configuration
# Auto-detected: Rust project
#
# Edit to match your needs. Run 'cidx preset list' for all available tools.
# Run 'cidx validate' to check, 'cidx run ci' to execute.

[security]
containers = ["trivy", "gitleaks", "cargo-audit"]

# The stock trivy preset is `fs /work`, which scans build output too. Two
# directories there produce pure noise:
#   - .cargo/ — the musl build redirects CARGO_HOME into the workspace (the
#     image's /opt/cargo is root-owned), so ~300 MB of crate sources land here.
#     Many crates ship their own Cargo.lock, and trivy reads those as if they
#     were ours: it reported aws-lc-sys 0.31.0 as vulnerable while this project
#     actually resolves 0.43.0, well past the fix.
#   - target/ — `cargo package` freezes historical Cargo.locks under
#     target/package/.
# The real lockfile at the repo root stays scanned, and cargo-audit is the hard
# gate on Rust dependencies either way.
[containers.trivy]
command = "fs --skip-dirs .cargo --skip-dirs target --skip-dirs node_modules /work"

# prettier dropped: `cidx init` auto-added it, but this repo is Rust-only and
# its sole target is the hand-wrapped Markdown (79 cols, matching CLAUDE.md).
# Re-add with a .prettierrc when the default theme ships CSS.
[code]
containers = ["clippy", "rustfmt", "commitizen"]

# cargo-test covers the Rust unit tests; probatum covers behaviour (does the
# binary DO what it claims). See CLAUDE.md — a check belongs to exactly one.
#
# The build is listed here on purpose, even though the build phase also has
# one: `cidx generate github` emits every phase as a job depending only on
# bootstrap, so phases run in PARALLEL on separate runners with no artifact
# sharing. probatum runs the compiled binary, so the test phase has to produce
# it. Containers within a phase run in order, so the build lands the artifact
# before probatum looks for it.
#
# It is cargo-build-musl, same as the build phase: stela ships a static musl
# binary, so that is the artifact worth smoke-testing — and probatum's image is
# Alpine, which could not execute a glibc one anyway.
[test]
containers = ["cargo-build-musl", "cargo-test", "probatum", "playwright"]

# cidx pins preset images by digest, which is right, but it means each probatum
# release needs a bump commit upstream. probatum.toml relies on the cookie jar
# that shipped in 0.9.0 (probatum-org/probatum#5) and cidx's preset is still on
# 0.8.0, so the image moves here. The probatum repo overrides its own preset the
# same way. Drop this when cidx bumps.
[containers.probatum]
image = "ghcr.io/probatum-org/probatum:0.9.0"

# Static musl, not the stock cargo-build: the shipping artifact must run on any
# Linux without a matching glibc. See .cidx/presets.toml.
[build]
containers = ["cargo-build-musl"]

[pipelines.ci]
phases = ["security", "code", "test", "build"]

[pipelines.pr]
phases = ["security", "code", "test"]
